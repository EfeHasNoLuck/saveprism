name: Bug report
description: Something in SavePrism does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach a save that contains personal data (user name, Steam ID, account tokens).
        For security problems, do not use this form. See SECURITY.md.
  - type: input
    id: version
    attributes:
      label: SavePrism version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic Report
      description: Paste the report from the app, if available. Check it for personal data first.
      render: text
    validations:
      required: false
