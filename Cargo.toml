[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/*"]
exclude = ["fuzz"]

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
base64 = "0.23"
tracing = "0.1"
tempfile = "3.27"
flate2 = "1.1"
lz-str = "0.2"
uesave = "0.7"
aes = "0.9"
cbc = "0.2"
pbkdf2 = "0.13"
sha1 = "0.11"
serde_json = { version = "1.0", features = ["float_roundtrip"] }
clap = { version = "4.6", features = ["derive"] }
tracing-subscriber = "0.3"
proptest = "1.12"
insta = "1.49"
saveprism-core = { path = "crates/saveprism-core" }
saveprism-codecs = { path = "crates/saveprism-codecs" }

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.99"
repository = "https://github.com/huseyincancalti/saveprism"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
