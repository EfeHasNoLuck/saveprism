# cargo-deny politikası (SavePrism) — cargo-deny 0.18+ biçimi (version = 2).
#
# Kaynak: AGENTS.md kural 5, docs/architecture/kararlar.md ADR-006, docs/architecture/QUALITY.md §4.
#
# Lisans politikası:
#   - Yalnız aşağıdaki izinli (permissive) lisanslar kabul edilir. Listede olmayan her lisans reddedilir.
#   - GPL, AGPL, LGPL, SSPL, EUPL, CDDL listeye ASLA eklenmez (ADR-006: copyleft bağımlılık MIT'i bozar).
#   - MPL-2.0 kabul edilir; ancak MPL-2.0 bileşen dağıtılırken NOTICE dosyasında belirtilmesi gerekir.
#   - Apache-2.0 da NOTICE koşuluyla kullanılabilir.

[graph]
# Tüm özelliklerle çözümlenen bağımlılık ağacı denetlenir (özelliğe bağlı GPL bağımlılık gizlenmesin).
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    # libbz2-rs-sys: Julian Seward's permissive, BSD-style libbzip2 license (bzip2 crate backend).
    "bzip2-1.0.6",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
# Lisans tespiti bu eşiğin altındaysa hata verilir (belirsiz metinli lisanslara karşı).
confidence-threshold = 0.93

[licenses.private]
# Kendi crate'lerimiz de denetlensin (hepsi MIT). Yanlışlıkla GPL'li yerel crate yakalanır.
ignore = false

[advisories]
version = 2
# Bilinen güvenlik açıkları (vulnerability) cargo-deny tarafından her zaman hata sayılır.
# Yanked crate'ler uyarı verir.
yanked = "warn"
# Tauri'nin Linux GTK3 ağacındaki bakımsız dolaylı crate'ler kırmızı yapmasın diye
# yalnız workspace'in doğrudan bağımlılıkları bakımsızlık açısından kontrol edilir.
unmaintained = "workspace"
# Gerekçeli istisnalar buraya tek tek, RUSTSEC kimliği ve neden ile yazılır. Şu an yok.
ignore = []

[bans]
# Aynı crate'in birden fazla sürümü uyarıdır (Tauri ağacında kaçınılmaz olabilir).
multiple-versions = "warn"
# Sürümsüz (`*`) bağımlılık reddedilir.
wildcards = "deny"
# Workspace içi `path` bağımlılıklarında wildcard kabul edilir.
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
# Bilinmeyen registry ve git kaynakları reddedilir (tedarik zinciri).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
