# cargo-deny policy (SavePrism), cargo-deny 0.18+ format (version = 2).
#
# Source: CONTRIBUTING.md, "Licenses".
#
# License policy:
#   - Only the permissive licenses below are accepted. Any license not on the list is rejected.
#   - GPL, AGPL, LGPL, SSPL, EUPL and CDDL are NEVER added (a copyleft dependency breaks MIT).
#   - MPL-2.0 is accepted, but a shipped MPL-2.0 component must be named in the NOTICE file.
#   - Apache-2.0 is allowed under the same NOTICE condition.

[graph]
# The tree is resolved with all features, so a GPL dependency behind a feature cannot hide.
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    # libbz2-rs-sys: Julian Seward's permissive, BSD-style libbzip2 license (bzip2 crate backend).
    "bzip2-1.0.6",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
# License detection below this confidence is an error (guards against unclear license texts).
confidence-threshold = 0.93

[licenses.private]
# Our own crates are checked too (all MIT), so a local crate marked GPL by mistake is caught.
ignore = false

[advisories]
version = 2
# Known vulnerabilities are always an error in cargo-deny.
# Yanked crates give a warning.
yanked = "warn"
# Only the workspace's direct dependencies are checked for being unmaintained, so unmaintained
# indirect crates in Tauri's Linux GTK3 tree do not turn the check red.
unmaintained = "workspace"
# Exceptions go here one by one, with the RUSTSEC id and the reason. None at the moment.
ignore = []

[bans]
# Several versions of one crate is a warning (hard to avoid in the Tauri tree).
multiple-versions = "warn"
# Dependencies without a version (`*`) are rejected.
wildcards = "deny"
# Wildcards are fine for `path` dependencies inside the workspace.
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
# Unknown registries and git sources are rejected (supply chain).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
