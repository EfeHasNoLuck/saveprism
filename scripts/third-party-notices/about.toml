# cargo-about config for THIRD_PARTY_NOTICES.md (see generate.sh). Same license list as deny.toml.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    # libbz2-rs-sys: Julian Seward's permissive, BSD-style libbzip2 license (bzip2 crate backend).
    "bzip2-1.0.6",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
